[package]
name = "rustplay"
version = "0.2.0"
edition = "2024"

[dependencies]
localsend = { path = "vendor/localsend-core", features = ["discovery", "http"] }
aes = "0.8"
anyhow = "1.0.104"
bytes = "1.12.1"
cbc = "0.1"
cpal = "0.18.2"
ctr = "0.9"
ed25519-dalek = "2"
env_logger = "0.11.11"
fdk-aac = "0.8.0"
futures-util = "0.3.34"
getrandom = "0.2"
hex = "0.4.3"
log = "0.4.34"
md-5 = "0.10"
mdns-sd = "0.21.6"
pem = "4"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["io"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
tauri-plugin-dialog = "2"
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Foundation_Collections", "Storage_Streams", "Devices_Enumeration", "Devices_Radios", "Win32_Media"] }
tauri-plugin-single-instance = "2"

[build-dependencies]
cc = "1.10.0"
tauri-build = "2"

[dev-dependencies]
fdk-aac-sys = "0.5"
